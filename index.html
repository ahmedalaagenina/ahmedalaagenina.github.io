  <!-- ── Instant splash (pure CSS, paints in ~0.3s) ──────────────── -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #060A14;
      height: 100%;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060A14;
      z-index: 9999;
      transition: opacity .45s ease, visibility .45s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash.gone { opacity: 0; visibility: hidden; }
    #splash .glow {
      position: absolute;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129,140,248,.14) 0%, rgba(6,10,20,0) 60%);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    #splash .mono {
      width: 84px; height: 84px;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #818CF8, #22D3EE);
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 0 60px rgba(129,140,248,.45);
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    #splash h1 {
      margin: 26px 0 6px;
      color: #E9EDF8;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    #splash p {
      margin: 0;
      color: #8C95AC;
      font-size: 14px;
    }
    #splash .bar {
      margin-top: 30px;
      width: 168px; height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }
    #splash .bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, #818CF8, #22D3EE);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(420%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="glow"></div>
    <div class="mono">AA</div>
    <h1>Ahmed Alaa</h1>
    <p>Senior Mobile Engineer · Flutter | Android</p>
    <div class="bar"><span></span></div>
  </div>

  <script>
    // Hide the splash the moment Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('gone');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        setTimeout(function () { splash.remove(); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
