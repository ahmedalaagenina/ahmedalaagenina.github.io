  <script>
    // Old shared links use the hash form (/#/links). The app uses path URLs,
    // so Flutter reads location.pathname ("/") and would ignore the hash.
    // The fragment never reaches the server either, so the fix has to run
    // here, before Flutter boots: rewrite /#/links to /links in place.
    (function () {
      var h = window.location.hash;
      if (h.indexOf('#/') === 0) {
        history.replaceState(null, '', h.slice(1) || '/');
      }
    })();
  </script>

  <style>
    :root { --bg: #070A12; --fg: #E8EDF6; --muted: #8A94A8; --signal: #13B9FD; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg);
      transition: opacity .25s ease-out;
    }
    #loader.gone { opacity: 0; pointer-events: none; }
    #loader svg { width: 158.4px; height: 57.2px; overflow: visible; }
    #loader path {
      fill: var(--fg); fill-opacity: 0;
      stroke: var(--signal); stroke-width: 18; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: draw .9s cubic-bezier(.65,0,.35,1) forwards, fill .35s ease-out .75s forwards;
    }
    #loader path.m { fill: var(--muted); }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; stroke-opacity: 0; } }
    /* Only shows if loading is slow, so fast loads never see a spinner. */
    #loader .bar {
      margin-top: 28px; width: 120px; height: 2px; border-radius: 2px; overflow: hidden;
      background: rgba(138,148,168,.18); opacity: 0;
      animation: appear .3s ease-out 1.6s forwards;
    }
    #loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--signal);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes appear { to { opacity: 1; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #loader path { animation: none; fill-opacity: 1; stroke-opacity: 0; }
      #loader .bar::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
  <script>
    // Match the saved theme before the first paint (no dark flash for
    // light-mode visitors). Flutter's shared_preferences key is prefixed.
    try {
      var saved = localStorage.getItem('flutter.theme_mode');
      if (saved && saved.indexOf('light') !== -1) {
        document.documentElement.style.setProperty('--bg', '#F4F6FA');
        document.documentElement.style.setProperty('--fg', '#0B1220');
        document.documentElement.style.setProperty('--muted', '#525D70');
        document.documentElement.style.setProperty('--signal', '#0175C2');
      }
    } catch (e) {}
  </script>
